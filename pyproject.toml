[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pykiosk"
version = "0.0.0" # GitHub Action oppdaterer denne automatisk ved release
description = "En fleksibel kiosk-løsning med Tkinter, Webview og skrivebordsrotasjon for Linux/X11."
readme = "README.md"
authors = [{ name = "Brage Skjønborg" }]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
requires-python = ">=3.8"
dependencies = ["pywebview", "fastapi", "uvicorn", "PyGObject", "Pillow"]

[project.scripts]
pykiosk = "pykiosk.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pykiosk", "pykiosk.*"]
