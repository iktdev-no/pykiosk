name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest

    permissions:
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set version from Git Tag in pyproject.toml
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Setting version to: $TAG_VERSION"

          # Skriver versjonen direkte inn i pyproject.toml i roten
          sed -i "s/^version = \".*\"/version = \"$TAG_VERSION\"/" pyproject.toml

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package (Wheel and SDist)
        run: python -m build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
